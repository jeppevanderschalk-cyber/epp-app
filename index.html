  var alert=document.getElementById("eppRuntimeAlert");

  alert.textContent="Er ging iets mis. Houd deze pagina open en controleer of je invoer online is opgeslagen voordat je opnieuw laadt.";
};
window.addEventListener("error",function(e){window.__eppError((e.error&&e.error.stack)||e.message||"Onbekende fout");});
</script>
<script>
var EPP_AUTH_STORAGE_KEY="epp-app-auth-v1";
var EPP_AUTH_ROLE_KEY="epp-app-role-v1";
var EPP_AUTH_CLUB_KEY="epp-app-club-v1";
var EPP_CLUBS=[
  {id:"svbb", label:"SV Beemte Broekland", managedAuth:true, space:"epp-app"},
  {id:"mercurius75", label:"SV Mercurius '75", managedAuth:true, space:"epp-app-mercurius75"},
  {id:"apgs",label:"APGS",managedAuth:true,space:"epp-app-apgs"},
  {id:"maarheeze",label:"SV Maarheeze",managedAuth:true,space:"epp-app-maarheeze"},
  {id:"politienoordholland",label:"Schietvereniging Politie Noord-Holland",managedAuth:true,space:"epp-app-politienoordholland"},
  {id:"hansi",label:"Schietteam HANSI",managedAuth:true,space:"epp-app-hansi"},
  {id:"thorheim",label:"SV Thorheim",managedAuth:true,space:"epp-app-thorheim"},
  {id:"schietteamkl",label:"Schietteam Koninklijke Landmacht",managedAuth:true,space:"epp-app-schietteamkl"},
  {id:"dekorrel",label:"SV De Korrel - Druten",managedAuth:true,space:"epp-app-dekorrel"},
  {id:"willemtell",label:"SV Willem-Tell",managedAuth:true,space:"epp-app-willemtell"},
  {id:"dehelm",label:"SV De Helm",managedAuth:true,space:"epp-app-dehelm"},
  {id:"flevoschutters",label:"S.V. de Flevoschutters",managedAuth:true,space:"epp-app-flevoschutters"},
  {id:"devrijheidheiloo",label:"S.V. De Vrijheid Heiloo",managedAuth:true,space:"epp-app-devrijheidheiloo"},
  {id:"hpsv",label:"S.V. HPSV",managedAuth:true,space:"epp-app-hpsv"},
  {id:"devrijheidheemskerk",label:"S.V. De Vrijheid Heemskerk",managedAuth:true,space:"epp-app-devrijheidheemskerk"},
  {id:"dsvmarine",label:"S.V. DSV Marine",managedAuth:true,space:"epp-app-dsvmarine"},
  {id:"eppnationaal", label:"EPP Nationaal", managedAuth:true, space:"epp-app-nationaal"},
  {id:"gast", label:"Gast", managedAuth:true, space:"epp-app-gast"}
];
function eppSha256Hex(text){
  var bytes=new TextEncoder().encode(text);
  return crypto.subtle.digest("SHA-256",bytes).then(function(digest){
    return Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  });
}
function eppShowApp(){
  var gate=document.getElementById("loginGate");
  if(gate.contains(document.activeElement))document.activeElement.blur();
  gate.setAttribute("inert","");
  gate.setAttribute("hidden","");
  document.getElementById("root").removeAttribute("hidden");
}
var EPP_SESSION_KEY='epp-session-v2';
function eppSession(){try{if(!sessionStorage.getItem(EPP_SESSION_KEY)&&localStorage.getItem(EPP_SESSION_KEY))sessionStorage.setItem(EPP_SESSION_KEY,localStorage.getItem(EPP_SESSION_KEY));localStorage.removeItem(EPP_SESSION_KEY);return JSON.parse(sessionStorage.getItem(EPP_SESSION_KEY)||'null');}catch{return null;}}
function eppRawCall(fn,payload){
  var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uc296eGprbHRjbmV4cXBud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDI3MTMsImV4cCI6MjEwNTQ3ODcxM30.xfgh12ksiCiSZGxXsrIF5HIiw6w418cECT476mBrUp0';
  return fetch('https://nnsozxjkltcnexqpnwia.supabase.co/functions/v1/'+fn,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(20000)}).then(async function(r){var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'server_fout');return d;});
}
var eppLoginGateInitialized=false;
var eppAuthAttempt=0;
function eppShowLoginGate(){
  document.getElementById("root").setAttribute("hidden","");
  document.getElementById("loginGate").removeAttribute("hidden");
  document.getElementById("loginGate").removeAttribute("inert");
  if(eppLoginGateInitialized)return;
  eppLoginGateInitialized=true;
  var lastClub=localStorage.getItem(EPP_AUTH_CLUB_KEY);
  if(lastClub==='beemtebroekland')lastClub='svbb';
  var clubSel=document.getElementById("loginClub");
  if(lastClub) clubSel.value=lastClub;
  var pw=document.getElementById("loginPassword");
  pw.value="";
  document.getElementById("loginError").textContent="";
  var registration=sessionStorage.getItem('epp-registration-login');
  if(registration){
    try{var details=JSON.parse(registration);clubSel.value=details.clubId;document.getElementById('loginFirstName').value=details.firstName;document.getElementById('loginLastName').value=details.lastName;document.getElementById('loginEmail').value=details.username||details.email||'';document.getElementById('loginStatus').textContent=details.pendingApproval?'Account aangemaakt. Je vereniging moet je lidmaatschap eerst goedkeuren. Daarna kun je inloggen.':'Account aangemaakt. Log in met je eigen wachtwoord.';eppApplyLoginEmail();}catch{}
    sessionStorage.removeItem('epp-registration-login');
  }
  var emailField=document.getElementById('loginEmail');
  (!document.getElementById('loginEmailLabel').hidden&&!emailField.disabled&&!emailField.value?emailField:pw).focus({preventScroll:true});
}
var eppPersonalLogin=false;
var eppLoginClubRequired=false;
function eppSetPersonalLogin(enabled){
  eppPersonalLogin=enabled&&document.getElementById('loginRole').value!=='hoofdbeheer';
  if(document.getElementById('loginRole').value==='schutter')localStorage.setItem('epp-personal-login-preferred',eppPersonalLogin?'1':'0');
  ['First','Last'].forEach(function(part){
    document.getElementById('login'+part+'Label').hidden=true;
    document.getElementById('login'+part+'Name').required=false;
    document.getElementById('login'+part+'Name').disabled=true;
  });
  document.getElementById('loginEmailLabel').hidden=!eppPersonalLogin;
  document.getElementById('loginEmail').disabled=!eppPersonalLogin;
  eppApplyLoginEmail();
  var toggle=document.getElementById('loginPersonalToggle');
  toggle.hidden=document.getElementById('loginRole').value==='hoofdbeheer';
  toggle.textContent='Ik heb nog geen account';
  document.getElementById('loginClubLabel').hidden=!eppLoginClubRequired||!eppPersonalLogin;
  document.getElementById('loginPassword').value='';
  document.getElementById('loginError').textContent='';
}
function eppApplyLoginEmail(){document.getElementById('loginEmail').required=eppPersonalLogin;}
document.getElementById('loginEmail').addEventListener('input',function(){eppApplyLoginEmail();eppLoginClubRequired=false;document.getElementById('loginClubLabel').hidden=true;});
document.getElementById('loginPersonalToggle').addEventListener('click',function(){
  if(document.getElementById('loginRole').value!=='schutter')return;
  eppAuthAttempt++;
  sessionStorage.removeItem(EPP_SESSION_KEY);
  location.hash='account-aanmaken';location.reload();
});
sessionStorage.removeItem('epp-personal-login');
eppSetPersonalLogin(true);
var eppSelectedLoginRole=document.getElementById('loginRole').value;
document.getElementById('loginRole').addEventListener('change',function(){
  if(this.value===eppSelectedLoginRole)return;
  eppSelectedLoginRole=this.value;
  eppSetPersonalLogin(this.value==='schutter');
  document.getElementById('loginPassword').value='';
  document.getElementById('loginError').textContent='';
  eppApplyLoginHelp();
});
document.getElementById('loginPasswordToggle').addEventListener('click',function(){
  var pw=document.getElementById('loginPassword'),show=pw.type==='password';
  pw.type=show?'text':'password';this.setAttribute('aria-pressed',String(show));
  this.setAttribute('aria-label',show?'Wachtwoord verbergen':'Wachtwoord tonen');this.title=show?'Wachtwoord verbergen':'Wachtwoord tonen';
});
function eppApplyLoginHelp(){document.getElementById('loginHelp').textContent=document.getElementById('loginRole').value==='hoofdbeheer'?'Neem contact op met de technisch beheerder van de EPP-app voor hulp bij het hoofdbeheeraccount.':'Neem contact op met je verenigingsbeheerder of hoofdbeheer voor hulp bij je account.';}
document.getElementById('loginHelpToggle').addEventListener('click',function(){
  var help=document.getElementById('loginHelp');eppApplyLoginHelp();help.hidden=!help.hidden;this.setAttribute('aria-expanded',String(!help.hidden));
});
document.getElementById("loginForm").addEventListener("submit",function(event){
  event.preventDefault();
  var role=document.getElementById('loginRole').value;
  var clubId=role==='hoofdbeheer'?'eppnationaal':role==='schutter'&&!eppPersonalLogin?'svbb':document.getElementById("loginClub").value;
  var club=EPP_CLUBS.find(function(c){return c.id===clubId;});
  var entered=document.getElementById("loginPassword").value;
  if(club){
    eppAuthAttempt++;
    var submitButton=document.querySelector(".login-submit");
    submitButton.disabled=true;
    var username=role==='hoofdbeheer'?'hoofdbeheer':'kijker';
    var identifier=document.getElementById('loginEmail').value.trim();
    var credentials=eppPersonalLogin?(identifier.includes('@')?{email:identifier}:{username:identifier}):{username:username};
    eppRawCall("epp-auth",{clubId:club.id,autoClub:eppPersonalLogin&&!eppLoginClubRequired,action:"login",...credentials,password:entered}).then(function(result){
      sessionStorage.setItem(EPP_SESSION_KEY,JSON.stringify(result));
      localStorage.setItem(EPP_AUTH_STORAGE_KEY,"1");
      localStorage.setItem(EPP_AUTH_ROLE_KEY,result.account.role);
      localStorage.setItem(EPP_AUTH_CLUB_KEY,result.account.clubId);
      location.reload();
    }).catch(function(error){
      if(error.message==='vereniging_kiezen_nodig'){eppLoginClubRequired=true;document.getElementById('loginClubLabel').hidden=false;document.getElementById('loginError').textContent='Deze inlognaam komt bij meerdere verenigingen voor. Kies je vereniging of gebruik je e-mailadres.';return;}
      if(error.message==='vereniging_goedkeuring_nodig'){document.getElementById('loginError').textContent='Je account wacht op goedkeuring door je vereniging. Neem contact op met je verenigingsbeheerder.';return;}
      if(error.message==='email_verplicht_bij_naamgenoten'){document.getElementById('loginError').textContent='Er zijn meerdere accounts met deze naam. Log in met het e-mailadres van je account.';return;}
      document.getElementById("loginError").textContent=error.message==="ongeldig_wachtwoord"?(role==='schutter'&&!eppPersonalLogin?'Dit is de toegang voor nieuwe schutters. Heb je al een account? Kies hieronder Inloggen met eigen account en vul je vereniging, naam en eigen wachtwoord in.':'Inloggen niet gelukt. Controleer je gebruikersnaam of e-mailadres en je wachtwoord. Na meerdere pogingen kan de toegang tijdelijk geblokkeerd zijn.') :"Inloggen is tijdelijk niet beschikbaar. Probeer het later opnieuw.";
    }).finally(function(){submitButton.disabled=false;});
    return;
  }
  document.getElementById("loginError").textContent="Kies je vereniging.";
});
var eppStoredRole=localStorage.getItem(EPP_AUTH_ROLE_KEY);
var eppStoredClub=localStorage.getItem(EPP_AUTH_CLUB_KEY);
var eppClubValid=EPP_CLUBS.some(function(c){return c.id===eppStoredClub;});
var savedSession=eppSession();
var eppAuthReady=Promise.resolve(false);
eppShowLoginGate();
var eppSessionAttempt=eppAuthAttempt;
if(savedSession && eppClubValid){
  eppAuthReady=eppRawCall('epp-auth',{action:'session',clubId:eppStoredClub,sessionToken:savedSession.sessionToken}).then(function(result){
    if(eppAuthAttempt!==eppSessionAttempt)return false;
    sessionStorage.setItem(EPP_SESSION_KEY,JSON.stringify({...savedSession,account:result.account}));
    localStorage.setItem(EPP_AUTH_ROLE_KEY,result.account.role);return true;
  }).catch(function(){if(eppAuthAttempt===eppSessionAttempt){sessionStorage.removeItem(EPP_SESSION_KEY);eppShowLoginGate();}return false;});

const shooterCandidates = (directory, published) => {
  const normalize = name => String(name||"").trim().replace(/\s+/g," ").toLocaleLowerCase("nl-NL");
  const result = directory.map(s=>({key:s.id,id:s.id,publicId:s.public_id,name:s.display_name,club:s.club||CLUB.label,lease:s.lease}));
  const seen = new Set();
  const known = new Set(result.map(s=>normalize(s.name)));
  for(const source of [published.sources.ind,published.sources.open])for(const s of source.rows){
    const key=normalize(s.name)+"|"+normalize(s.club);
    if(known.has(normalize(s.name))||seen.has(key))continue;
    seen.add(key);result.push({key:"published:"+key,name:s.name,club:s.club});
  }
  return result.sort((a,b)=>a.name.localeCompare(b.name,"nl"));
};

const EppPasswordGate = ({isTrainer, onUnlock}) => {
  const [pw,setPw] = React.useState("");
  const [busy,setBusy] = React.useState(false);
  const [err,setErr] = React.useState("");
  const submit = async () => {
    if(!pw.trim())return;
    setBusy(true);setErr("");
    try{
      await eppCall(isTrainer?"epp-admin":"epp-signup",{clubId:CLUB_ID,password:pw,action:"list_matches"});
      onUnlock(pw);
    }catch(e){setErr("Onjuist wachtwoord");}
    finally{setBusy(false);}
  };
  return h("div",{className:"card"},
    h("div",{className:"card-head"},h("div",{className:"eyebrow"},"Inschrijven voor wedstrijden")),
    h("div",{className:"card-body",style:{display:"flex",flexDirection:"column",gap:10}},
      h("p",{className:"hint"},"Vul hetzelfde ",isTrainer?"trainer":"schutter","wachtwoord in als waarmee je bent ingelogd."),
      h("input",{className:"txt-in",type:"password",placeholder:"Wachtwoord",value:pw,
        onChange:e=>setPw(e.target.value),onKeyDown:e=>e.key==="Enter"&&submit()}),
      err && h("p",{className:"hint",style:{color:C.red}},err),
      h("button",{className:"btn btn-gold btn-full",disabled:busy,onClick:submit},busy?"Controleren...":"Ontgrendelen")
    )
  );
};

const MemberRegistration = () => {
  const [form,setForm]=React.useState({clubId:"",firstName:"",lastName:"",email:"",username:"",password:"",repeat:"",publicationConsent:false});
  const [busy,setBusy]=React.useState(false);
  const [error,setError]=React.useState("");
  const submit=async event=>{
    event.preventDefault();if(busy)return;
    if(form.password!==form.repeat){setError("De wachtwoorden zijn niet gelijk.");return;}
    setBusy(true);setError("");
    try{
      const result=await eppRawCall("epp-auth",{clubId:CLUB_ID,sessionToken:eppSession()?.sessionToken,action:"register_member",registrationClubId:form.clubId,username:form.username,firstName:form.firstName,lastName:form.lastName,email:form.email,newPassword:form.password,publicationConsent:form.publicationConsent});
      localStorage.setItem(EPP_AUTH_CLUB_KEY,result.account.clubId);
      localStorage.setItem('epp-personal-login-preferred','1');
      sessionStorage.setItem('epp-personal-login','1');
      sessionStorage.setItem('epp-registration-login',JSON.stringify({clubId:result.account.clubId,firstName:form.firstName.trim(),lastName:form.lastName.trim(),email:form.email.trim(),username:form.username.trim(),pendingApproval:result.pendingApproval}));
      sessionStorage.removeItem(EPP_SESSION_KEY);
      localStorage.removeItem(EPP_AUTH_STORAGE_KEY);
      localStorage.removeItem(EPP_AUTH_ROLE_KEY);
      history.replaceState(null,'',location.pathname+location.search);
      location.reload();
    }catch(e){
      if(e.message==='gebruikersnaam_ongeldig'||e.message==='gebruikersnaam_bestaat'||e.message==='gebruikersnaam_al_geregistreerd'){setError(e.message==='gebruikersnaam_ongeldig'?'Gebruik 3 tot 30 letters, cijfers, punten, streepjes of underscores. Kies een eigen gebruikersnaam.':'Deze gebruikersnaam is al in gebruik. Kies een andere.');return;}

const TabInschrijvenLid = ({password, onAuthFail, flash}) => {
  const sharedAccount=eppSession()?.account?.username==='kijker';
  const [shooters,setShooters] = React.useState([]);
  const [shooterName,setShooterName] = React.useState("");
  const [matches,setMatches] = React.useState(null);
  const [mySignups,setMySignups] = React.useState({});
  const [draft,setDraft] = React.useState({});
  const [savingId,setSavingId] = React.useState(null);

  const load = React.useCallback(async ()=>{
    if(sharedAccount)return;
    try{
      const r = await eppCall("epp-signup",{clubId:CLUB_ID,password,action:"list_matches"});
      const planned=await eppCall('epp-planner',{clubId:CLUB_ID,action:'catalog'});
      const directory=await eppCall("epp-signup",{clubId:CLUB_ID,action:"list_shooters"});
      setShooters(directory.shooters||[]);setShooterName(directory.shooters?.[0]?.id||"");
      const combined=new Map((r.matches||[]).map(m=>[m.id,m]));
      (planned.matches||[]).forEach(m=>combined.set(m.id,{...m,planned:true}));
      setMatches([...combined.values()].sort((a,b)=>String(a.match_date||'9999').localeCompare(String(b.match_date||'9999'))));
    }catch(e){onAuthFail();}
  },[password]);
  React.useEffect(()=>{load();},[load]);

  const loadMine = React.useCallback(async (name)=>{
    if(!name)return;
    try{
      const r = await eppCall("epp-signup",{clubId:CLUB_ID,action:"my_signups",shooterId:name});
      const map={};
      (r.signups||[]).forEach(s=>{map[s.match_id]=s.epp_signup_disciplines||[];});
      setMySignups(map);
    }catch(e){onAuthFail();}
  },[password]);
  React.useEffect(()=>{loadMine(shooterName);},[shooterName,loadMine]);

  React.useEffect(()=>{
    if(!matches)return;
    setDraft(()=>{
      const next={};
      matches.forEach(m=>{
        const existing = mySignups[m.id];
        const disc={};
        (existing||[]).forEach(d=>{disc[d.discipline]={checked:true,time_block:d.time_block,specific_time:d.specific_time};});
        next[m.id] = {active:!!existing, disciplines:disc};
      });
      return next;
    });
  },[matches,mySignups]);

  const isNotOpen = m => !!m.registration_opens_on && new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Amsterdam'}).format(new Date()) < m.registration_opens_on;
  const isClosed = m => isNotOpen(m) || !!m.planning_pending || !!(m.deadline && todayIso_client() > m.deadline);
  const serverStateFor = m => {
    const existing = mySignups[m.id];
    const disc={};
    (existing||[]).forEach(d=>{disc[d.discipline]={checked:true,time_block:d.time_block,specific_time:d.specific_time};});
    return {active:!!existing, disciplines:disc};
  };
  const isDirty = m => JSON.stringify(draft[m.id]||{active:false,disciplines:{}}) !== JSON.stringify(serverStateFor(m));

  const setActive = (m, active) => setDraft(p=>({...p,[m.id]:{...(p[m.id]||{disciplines:{}}),active}}));
  const toggleDisc = (m,d,checked) => setDraft(p=>{
    const cur = p[m.id]||{active:true,disciplines:{}};
    const disc = {...cur.disciplines};
    if(checked) disc[d.id] = disc[d.id] || {checked:true,time_block:"geen_voorkeur",specific_time:null};
    else delete disc[d.id];
    return {...p,[m.id]:{...cur,disciplines:disc}};
  });
  const changeDisc = (m,dId,value) => setDraft(p=>({...p,[m.id]:{...p[m.id],disciplines:{...p[m.id].disciplines,[dId]:value}}}));

  const save = async (m) => {
    if(!shooterName){flash("Kies eerst je naam");return;}
    const d = draft[m.id] || {active:false,disciplines:{}};
    setSavingId(m.id);
    try{
      if(!d.active){
        if(mySignups[m.id]) await eppCall("epp-signup",{clubId:CLUB_ID,action:"delete_signup",shooterId:shooterName,matchId:m.id});
        flash("Afgemeld");
      }else{
        const disciplines = Object.entries(d.disciplines).map(([discipline,v])=>({discipline,time_block:v.time_block,specific_time:v.specific_time||null}));
        if(!disciplines.length){flash("Kies minimaal één discipline");setSavingId(null);return;}
        await eppCall("epp-signup",{clubId:CLUB_ID,action:"save_signup",shooterId:shooterName,matchId:m.id,disciplines});
        flash("Inschrijving opgeslagen");
      }
      await loadMine(shooterName);
    }catch(e){flash("Opslaan mislukt: "+e.message);}
    finally{setSavingId(null);}
  };

  if(sharedAccount)return h(MemberRegistration);
  if(!matches) return h("div",{style:{textAlign:"center",padding:48,color:C.muted}},"Laden…");

  return h("div",{className:"page-fade",style:{display:"flex",flexDirection:"column",gap:12}},
    h("div",{className:"card"},
      h("div",{className:"card-head"},h("div",{className:"eyebrow"},"Jouw inschrijvingen")),
      h("div",{className:"card-body"},h("strong",null,shooters.find(s=>s.id===shooterName)?.naam||eppSession()?.account?.displayName))
    ),
    !shooterName ? h("div",{className:"empty"},h("p",null,"Je account heeft geen actief schutterprofiel. Neem contact op met beheer.")) :
    !matches.length ? h(Empty,{msg:"Nog geen wedstrijden open",hint:"Zodra er een wedstrijd openstaat voor inschrijving, zie je hem hier."}) :
    matches.map(m=>{
      if(m.planned)return h(PlannerMatchCard,{key:m.id,match:m});
      const d = draft[m.id] || {active:false,disciplines:{}};
      const closed = isClosed(m);
      const dirty = isDirty(m);
      const hasServerRecord = !!mySignups[m.id];
      const nDisc = Object.keys(d.disciplines).length;
      const dotClass = !d.active ? "" : nDisc===0 ? "red" : "green";
      const dotLabel = !d.active ? "Niet ingeschreven" : nDisc===0 ? "Discipline kiezen" : "Compleet";
      const notOffered = EPP_DISCIPLINES.filter(x=>!m.offered_disciplines.includes(x.id));
      return h("div",{key:m.id,className:"match-card","data-on":d.active?"1":"0"},
        h("div",{className:"match-hd"},
          h("div",null,
            h("div",{className:"match-org"},m.organizer),
            h("div",{className:"match-sub"},eppFmtMatchDates(m)),
            h("div",{className:"match-sub"},isNotOpen(m)?"Inschrijving opent op "+eppFmtDate(m.registration_opens_on):closed?"Inschrijving gesloten":`Deadline: ${eppFmtDate(m.deadline)}`)
          ),
          h("div",{className:"status-dot "+dotClass},dotLabel)
        ),
        closed && h("p",{className:"hint"},
          isNotOpen(m)?"Aanmelden is mogelijk vanaf "+eppFmtDate(m.registration_opens_on)+". ":m.planning_pending?"De organisator bereidt de tijdsloten voor. Je bestaande inschrijving blijft behouden. ":"Inschrijven via de app kan niet meer. Wil je nog mee, mail dan zelf naar het inschrijfbureau: ",
          isNotOpen(m)?null:m.organizer_email
            ? h("a",{href:`mailto:${m.organizer_email}`,style:{color:C.goldLt,fontWeight:800}},m.organizer_email)
            : "(geen e-mailadres bekend, vraag de trainer)"
        ),
        !closed && h("button",{className:"btn "+(d.active?"btn-danger":"btn-gold")+" btn-full",onClick:()=>setActive(m,!d.active)},d.active?"Afmelden":"Doe mee"),
        d.active && h("div",{style:{display:"flex",flexDirection:"column"}},
          EPP_DISCIPLINES.filter(x=>m.offered_disciplines.includes(x.id)).map(disc=>
            h(EppDisciplineRow,{key:disc.id,d:disc,checked:!!d.disciplines[disc.id],
              value:d.disciplines[disc.id]||{time_block:"geen_voorkeur",specific_time:null},
              onToggle:c=>toggleDisc(m,disc,c),onChange:v=>changeDisc(m,disc.id,v),disabled:closed})
          ),
          !!notOffered.length && h("p",{className:"hint",style:{marginTop:8}},"Niet aangeboden: ",notOffered.map(x=>x.label).join(", "))
        ),
        !closed && (d.active || hasServerRecord) && h("button",{
          className:"btn "+(dirty?"btn-danger":"btn-success")+" btn-full",
          disabled:savingId===m.id || !dirty,
          onClick:()=>save(m)
        }, savingId===m.id?"Bezig...":dirty?"Opslaan":"Opgeslagen")
      );
    })
  );
};

    if(!payload || typeof payload!=="object")return;

    setStageShots({...DEFAULT_SHOTS,...(payload.stageShots||{})});
    setTombstones({shooters:{...(payload.tombstones?.shooters)},shots:{...(payload.tombstones?.shots)},monthWipes:{...(payload.tombstones?.monthWipes)},resetAt:payload.tombstones?.resetAt||0});
    latestPayload.current={...payload,stageShots:{...DEFAULT_SHOTS,...payload.stageShots},currentTraining:normalizedTraining};
  };
  const queueKey=KEY+"-records-v3"+(personalTraining?"-personal-"+eppSession().account.id:"");
  const store=React.useRef({base:{},busy:false,hydrated:false,restored:false,conflict:false,localOk:true});
  const persistQueue=()=>{
    try{
      localStorage.setItem(queueKey,JSON.stringify({base:store.current.base,wanted:latestPayload.current}));
      store.current.localOk=true;
    }catch(e){store.current.localOk=false;setSyncStatus("Lokale opslag vol: houd de app open tot online opslag is bevestigd.");}
  };
  const installRemote=remote=>{
    const state=store.current;
    const changed=EppStore.rebase(state.base,latestPayload.current||{},remote);
    if(changed.conflicts.length){
      state.conflict=true;
      setSyncStatus("Conflict: dezelfde invoer is elders gewijzigd. Jouw invoer blijft bewaard; controleer voordat je verdergaat.");
      return false;
    }
    state.base=remote;state.conflict=false;
    applyPayload(changed.payload);persistQueue();
    return true;
  };
  const pushRemote=async()=>{
    const state=store.current;
    if(!canTrain||!state.hydrated||state.busy||state.conflict)return false;
    const sent=latestPayload.current;
    const ops=EppStore.diff(state.base,sent);
    if(!ops.length)return true;
    persistQueue();state.busy=true;setSyncStatus("Online opslaan...");
    try{
      const result=await eppCall("epp-training",{clubId:CLUB_ID,action:"save",ops});
      const remote=EppStore.decode(result.entities||[]);
      // Preserve edits made while this request was in flight.
      state.base=sent;
      if(!installRemote(remote))return false;
      const pending=EppStore.diff(state.base,latestPayload.current).length;
      setSyncStatus(pending?"Nieuwe invoer wacht op opslag...":"Online opgeslagen");
      return !pending;
    }catch(e){
      if(e.status===409){
        try{
          const result=await eppCall("epp-training",{clubId:CLUB_ID,action:"load"});
          if(installRemote(EppStore.decode(result.entities||[])))setSyncStatus("Wijzigingen samengevoegd; jouw invoer wacht op opslag.");
        }catch(loadError){setSyncStatus("Niet opgeslagen: "+loadError.message);}
      }else setSyncStatus((state.localOk?"Lokaal bewaard, nog niet online: ":"Niet opgeslagen; houd deze pagina open: ")+e.message);
      return false;
    }finally{state.busy=false;}
  };
  const pullRemote=async()=>{
    const state=store.current;
    if(state.busy||state.conflict)return false;
    if(state.hydrated&&canTrain&&EppStore.diff(state.base,latestPayload.current).length)return pushRemote();
    state.busy=true;
    try{
      const result=await eppCall("epp-training",{clubId:CLUB_ID,action:"load"});
      const remote=EppStore.decode(result.entities||[]);
      if(!state.hydrated&&(!canTrain||!state.restored)){state.base=remote;applyPayload(remote);persistQueue();}
      else if(!installRemote(remote)){state.hydrated=true;setLoaded(true);return false;}
      state.hydrated=true;setLoaded(true);
      setSyncStatus(EppStore.diff(state.base,latestPayload.current).length?"Invoer wacht op online opslag...":"Online bijgewerkt");
      return true;
    }catch(e){setSyncStatus("Online laden mislukt: "+e.message);return false;}
    finally{state.busy=false;}
  };
  React.useEffect(()=>{
    try{
      const raw=localStorage.getItem(queueKey);
      if(raw){const q=JSON.parse(raw);store.current.restored=true;store.current.base=q.base||{};applyPayload(q.wanted||q.base||{});}
      // Legacy snapshots remain untouched and are never blindly uploaded.
    }catch(e){setSyncStatus("Lokale wachtrij kon niet worden gelezen; houd deze pagina open.");}
    pullRemote();
    const timer=eppPoll(()=>pullRemote(),10000);
    const online=()=>pullRemote();
    const unload=e=>{if(canTrain&&EppStore.diff(store.current.base,latestPayload.current).length){persistQueue();e.preventDefault();e.returnValue="";}};
    window.addEventListener("online",online);window.addEventListener("beforeunload",unload);
    return()=>{clearInterval(timer);window.removeEventListener("online",online);window.removeEventListener("beforeunload",unload);};
  },[]);
  React.useEffect(()=>{
    if(!loaded||!store.current.hydrated)return;
    persistQueue();
    if(!canTrain)return;
    const timer=setTimeout(()=>pushRemote(),600);
    return()=>clearTimeout(timer);
  },[shooters,scores,cameraShots,stageShots,currentTraining,bestParcours,bestStageAverages,archives,loaded]);

  // State helpers
  const addShooter = selectedId => {

  };
  const removeShooter = id => {if(!confirm("Schutter en scores verwijderen?"))return;markLocalEdit();setShooters(p=>p.filter(s=>s.id!==id));setCameraShots(p=>p.filter(s=>s.sid!==id));setScores(p=>{const n={...p};delete n[id];return n;});setTombstones(p=>({...p,shooters:{...p.shooters,[id]:Date.now()}}));};
  const markShotsDeleted = ids => {markLocalEdit();setTombstones(p=>({...p,shots:{...p.shots, ...Object.fromEntries(ids.map(id=>[id,Date.now()]))}}));};
  const setTrainingMode = mode => {markLocalEdit();setCurrentTraining(t=>({...t,mode,updatedAt:Date.now()}));};
  const setTrainingStage = stageKey => {markLocalEdit();setCurrentTraining(t=>({...t,stage:stageKey,updatedAt:Date.now()}));};
  const addRound = ({sid,type,stage:stageKey,score,details,source="handmatig",replaceKey=""}) => setCurrentTraining(t=>{
    markLocalEdit();
    const previous=replaceKey&&(t.rounds||[]).find(r=>r.replaceKey===replaceKey);
    const round = {...(details||{}),id:previous?.id||newId(),trainingId:t.id,sid,type,stage:stageKey||t.stage,score,source,replaceKey,ts:Date.now()};
    const rounds = replaceKey ? (t.rounds||[]).filter(r=>r.replaceKey!==replaceKey) : (t.rounds||[]);
    return {...t,rounds:[...rounds,round],updatedAt:Date.now()};
  });
  const addRoundAndFlash = data => {addRound(data);flash("Ronde ingevoerd; wacht op online bevestiging.");};
  const removeRoundByReplaceKey = replaceKey => {markLocalEdit();setCurrentTraining(t=>({...t,rounds:(t.rounds||[]).filter(r=>r.replaceKey!==replaceKey),updatedAt:Date.now()}));};
  const finishTraining = () => {
    const t = ensureTraining(currentTraining);
    if(!t.rounds.length) return flash("Nog geen rondes in deze training");
    const lines = shooters.map(s=>{
      const rounds = t.rounds.filter(r=>r.sid===s.id && r.type===t.mode && (t.mode==="parcours" || r.stage===t.stage));
      if(!rounds.length) return `${s.naam}: nog geen ronde`;
      const value = t.mode==="parcours" ? Math.max(...rounds.map(r=>r.score)) : avg(rounds.map(r=>r.score)).toFixed(1);
      return `${s.naam}: ${value} (${rounds.length} ronde${rounds.length===1?"":"s"})`;
    });
    if(store.current.busy||store.current.conflict||EppStore.diff(store.current.base,makePayload()).length)return flash("Sla eerst alle invoer online op voordat je afsluit.");
    if(!confirm(`Training afsluiten en nieuwe starten?\n\nDit wordt in de stand verwerkt:\n${lines.join("\n")}\n\nDe volledige training blijft in het archief.`)) return;
    const now = Date.now();
    const bestByShooter = {};
    t.rounds.filter(r=>r.type==="parcours").forEach(r=>{
      if(!bestByShooter[r.sid] || EppScoreRanking.compare({...r,final_score:r.score},{...bestByShooter[r.sid],final_score:bestByShooter[r.sid].score})<0) bestByShooter[r.sid] = {...r,score:r.score, rounds:t.rounds.filter(x=>x.sid===r.sid&&x.type==="parcours").length, ts:now, trainingId:t.id};
    });
    setBestParcours(prev=>mergeBestParcours(prev,bestByShooter));
    const stageResults = {};
    STAGES.forEach(st=>{
      const grouped = {};
      t.rounds.filter(r=>r.type==="stage" && r.stage===st.key).forEach(r=>{grouped[r.sid]=[...(grouped[r.sid]||[]),r];});
      Object.entries(grouped).forEach(([sid,rounds])=>{
        const average = avg(rounds.map(r=>r.score));
        if(average!=null) stageResults[st.key] = {...(stageResults[st.key]||{}), [sid]:{avg:average, rounds:rounds.length, best:Math.max(...rounds.map(r=>r.score)), ts:now, trainingId:t.id}};
      });
    });
    setBestStageAverages(prev=>mergeBestStageAverages(prev,stageResults));
    markLocalEdit();
    setArchives(p=>[...p,{...t,closedAt:now}]);
    setCurrentTraining(newTraining(t.mode,t.stage));
    flash("Nieuwe training gestart");
  };

  const clearCurrentTraining = () => {
    const t = ensureTraining(currentTraining);
    if(!(t.rounds||[]).length) return flash("Geen tijdelijke rondes om te wissen");
    if(!confirm("Nieuwe trainingsdag starten? De stand blijft bewaard, alleen de huidige losse rondes worden gewist.")) return;
    markLocalEdit();
    setArchives(p=>[...p,{...t,closedAt:Date.now(),excludedFromStand:true}]);
    setCurrentTraining(newTraining(t.mode,t.stage));
    flash("Nieuwe trainingsdag gestart");
  };

  const resetAll = () => {if(confirm("Alles wissen? Kan niet ongedaan worden.")){
    const now=Date.now();
    markLocalEdit();
    setTombstones(p=>({
      shooters:{...p.shooters, ...Object.fromEntries(shooters.map(s=>[s.id,now]))},
      shots:{...p.shots, ...Object.fromEntries(cameraShots.map(s=>[s.id,now]))},
      monthWipes:{...(p.monthWipes||{})},
      resetAt:now
    }));
    setShooters([]);setScores({});setCameraShots([]);setCurrentTraining(newTraining());setBestParcours({});setBestStageAverages({});setStageShots(DEFAULT_SHOTS);flash("Alles gewist");
  }};
  const logout = async () => {
    if(canTrain&&EppStore.diff(store.current.base,latestPayload.current).length&&!confirm("Er is nog niet online opgeslagen invoer. Die blijft lokaal bewaard. Toch uitloggen?"))return;
    persistQueue();
    try{await eppCall("epp-auth",{clubId:CLUB_ID,action:"logout"});}catch(e){}
    sessionStorage.removeItem(EPP_SESSION_KEY);localStorage.removeItem("epp-app-auth-v1");localStorage.removeItem(EPP_AUTH_ROLE_KEY);location.reload();
  };
  const viewHeadClub=club=>{
    if(!club)return;
    onHeadClubChange(club);
  };

  const syncNow = async () => {
    const ok=await pullRemote();
    if(ok)flash("Online opslag gecontroleerd");
  };
  const recoverConflict=async()=>{
    if(!confirm("Online gegevens opnieuw laden? Jouw niet opgeslagen invoer wordt eerst als lokale herstelkopie bewaard en niet automatisch overschreven."))return;
    try{
      localStorage.setItem(queueKey+"-conflict-"+Date.now(),JSON.stringify({base:store.current.base,wanted:latestPayload.current}));
      const result=await eppCall("epp-training",{clubId:CLUB_ID,action:"load"});
      const remote=EppStore.decode(result.entities||[]);
      store.current.base=remote;store.current.conflict=false;applyPayload(remote);persistQueue();
      setSyncStatus("Online gegevens geladen. Jouw eerdere invoer staat in een lokale herstelkopie.");
    }catch(e){setSyncStatus("Herstel niet uitgevoerd: "+e.message);}
  };

  const navItems = [
    {key:"home",    label:"Start",      icon:Icon.home},
    {key:"training",label:"Training",   icon:Icon.chart},
    {key:"landelijk",label:"Wedstrijden",icon:Icon.calendar},
    {key:"stand",   label:"Stand",      icon:Icon.trophy},
    {key:"instel",  label:"Meer",       icon:Icon.gear},
  ];

  const activeContent = !loaded
    ? h("div",{style:{textAlign:"center",padding:48,color:C.muted}},"Laden…")
    : tab==="home" ? h(PersonalHome,{shooters,currentTraining,archives,personalTraining,canTrain,setTab,onMatchScores:openMatchScores})
    : tab==="training" ? h(TrainingHub,{shooters,nieuw,setNieuw,addShooter,removeShooter,registeredShooters,shooterDirectoryStatus,reloadShooters,currentTraining,setTrainingMode,setTrainingStage,addRound:addRoundAndFlash,finishTraining,setTab,maxOf,isTrainer,canTrain,personalTraining,archives,trainingView,setTrainingView,onMatchScores:openMatchScores})
    : tab==="camera" && isTrainer ? h(TabCamera,{shooters,registeredShooters,shooterDirectoryStatus,addShooter,cameraShots,setCameraShots,maxOf,flash,addRound,trainingId:currentTraining.id})
    : tab==="stand"  ? h(SharedTrainingStand)
    : tab==="landelijk" ? h(TabLandelijk,{key:competitionMenuVisit,isTrainer,flash,shooters,eppPassword,setEppPassword,initialView:competitionEntry||'signup'})
    : tab==="instel" ? h(TabInstellingen,{isTrainer,stageShots,setStageShots,finishTraining,clearCurrentTraining,resetAll,syncConfig,setSyncConfig,syncStatus,syncNow,logout,setTab,canRestore:!store.current.busy&&!store.current.conflict&&!EppStore.diff(store.current.base,makePayload()).length,onRestored:pullRemote})
    : h(TabStand,{shooters,bestParcours,bestStageAverages,maxOf});

  const syncLevel=/^Online (opgeslagen|bijgewerkt|gegevens geladen)/.test(syncStatus||"")?"":/wacht|opslaan\.\.\.|gestart|samengevoegd/i.test(syncStatus||"")?"busy":"warn";
  return h("div",{className:"app"},
    h("style",null,CSS),
    h(AppTopbar,null,
        onHeadClubChange?h(HeadClubSelector,{clubs:headClubs||[],value:'',onChange:viewHeadClub}):h("div",{className:"club-tag","aria-label":"Ingelogde vereniging",title:accountClubName,},accountClubName)
    ),
    h("main",{className:"main"},h("p",{role:"status",className:syncLevel==="warn"?"sync-note":"sync-line "+syncLevel},syncStatus),
      h(PaymentReturn),
      h(PendingMembershipNotice,{onReview:()=>{setTab('instel');setTimeout(()=>{const el=document.getElementById('membership-requests');const box=el?.closest('details');if(box)box.open=true;el?.scrollIntoView({block:'start',behavior:'smooth'});},0);}}),
      canTrain&&syncLevel==="warn"&&!store.current.conflict&&h("button",{className:"btn btn-ghost",onClick:syncNow},"Opslag opnieuw proberen"),
      store.current.conflict&&h("button",{className:"btn btn-ghost",onClick:recoverConflict},"Online versie laden met herstelkopie"),activeContent),
    h("nav",{className:"bottomnav",style:{gridTemplateColumns:`repeat(${navItems.length},1fr)`}},
      navItems.map(n=>h("button",{key:n.key,className:"bnav-btn","data-on":tab===n.key?"1":"0","aria-current":tab===n.key?"page":undefined,onClick:()=>{if(n.key==='landelijk'){setCompetitionEntry(null);setCompetitionMenuVisit(v=>v+1);}setTab(n.key);}},
        n.icon(),n.label
      ))
    ),
    toast && h("div",{className:"toast",role:"status","aria-live":"polite"},toast)
  );
}

eppAuthReady.then(function(verified){
  if(location.hash==='#account-aanmaken'){ReactDOM.createRoot(document.getElementById('root')).render(h(RegistrationWorkspace));eppShowApp();return;}
  if(!verified)return;
  try{ReactDOM.createRoot(document.getElementById("root")).render(eppSession()?.account?.username==='kijker'?h(RegistrationWorkspace):eppSession()?.account?.mustChangePassword?h(PasswordChangeWorkspace,{logout:()=>{sessionStorage.removeItem(EPP_SESSION_KEY);location.reload();}}):h(eppSession()?.account?.isPlatformAdmin?HeadWorkspace:App));eppShowApp();}
  catch(e){if(window.__eppError)window.__eppError(e?.stack||String(e));}
});

</script>

<script src="install-help.js?v=2"></script>
</body>
